[package]
name = "aerokv-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "aerokv"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22" }
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }
tokio = { version = "1.43", features = ["full"] }
core-client = { path = "../../core-client" }
bytes = "1.10"

[features]
extension-module = ["pyo3/extension-module"]
default = []
