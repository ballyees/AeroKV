[package]
name = "core-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "core_client"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
hyper = { version = "1.5", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "http2"] }
http-body-util = "0.1"
http = "1.2"
bytes = "1.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
futures = "0.3"

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
aerokv-server = { path = "../server" }
