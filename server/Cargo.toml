[package]
name = "aerokv-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.43", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
hyper = { version = "1.5", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
http-body-util = "0.1"
http = "1.2"
subtle = { version = "2.6", default-features = false }
fxhash = "0.2"
num_cpus = "1.16"
core_affinity = "0.8"
bytes = "1.10"
itoa = "1.0"
tikv-jemallocator = "0.6"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

